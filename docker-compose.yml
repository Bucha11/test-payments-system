x-app: &app
  build: .
  env_file: .env
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cascade
      POSTGRES_PASSWORD: cascade
      POSTGRES_DB: cascade
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cascade"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  api:
    <<: *app
    command: sh -c "alembic upgrade head && uvicorn cascade.api.app:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      retries: 30

  worker:
    <<: *app
    command: taskiq worker cascade.infrastructure.tasks:broker
    depends_on:
      api: {condition: service_healthy}

  mock_a:
    build: .
    command: uvicorn mock_provider.app:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      MOCK_PROVIDER_NAME: mock_a
      WEBHOOK_URL: http://api:8000/webhooks/mock_a
    ports: ["8101:8000"]
    healthcheck: &mock_health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      retries: 30

  mock_b:
    build: .
    command: uvicorn mock_provider.app:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      MOCK_PROVIDER_NAME: mock_b
      WEBHOOK_URL: http://api:8000/webhooks/mock_b
    ports: ["8102:8000"]
    healthcheck: *mock_health
