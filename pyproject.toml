[project]
name = "payment-cascade"
version = "0.1.0"
description = "Payment cascading service (take-home)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "taskiq>=0.11",
    "taskiq-redis>=1.0",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "braintree>=4.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.120",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cascade", "src/mock_provider"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: needs Postgres/Redis from docker compose"]
filterwarnings = ["ignore::DeprecationWarning:braintree.*"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Explicit early returns read better in the engine/routing code than merged conditions.
ignore = ["SIM102", "SIM103"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["cascade.domain", "cascade.application"]
